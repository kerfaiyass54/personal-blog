<div class="container-fluid">
  <div class="card">

    <div class="card-header">
      @if (loading) {
        <div class="loading-state">Loading session details...</div>
      } @else if (loadError) {
        <div class="error-state">{{ loadError }}</div>
      } @else {
        <p class="eyebrow">LOGIN SESSION</p>
        <h1 class="text-center">
          Your login at <span>{{ time }}</span>
        </h1>

      @if (alert === 'ALERT_LOGIN') {
        <h2 class="text-center alert-login">
          <span class="status-dot"></span>
          Suspicious login detected
        </h2>
      } @else {
        <h2 class="text-center good-login">
          <span class="status-dot"></span>
          Login verified
        </h2>
      }
      }
    </div>

    @if (!loading && !loadError) {
    <div class="card-body grid">

      <app-information-card
        [title]="browser.title"
        [value]="browser.value"
        color="#4f46e5">
      </app-information-card>

      <app-information-card
        [title]="os.title"
        [value]="os.value"
        color="#4f46e5">
      </app-information-card>

    </div>

    <div class="card-footer">

      <app-button
        text="Go back"
        color="#4f46e5"
        [link]="'/' + role + '/user-history'">
      </app-button>

      <app-button
        text="Not you?"
        color="#dc2626"
        (action)="notMe()">
      </app-button>

    </div>
    }

  </div>
</div>
