<main class="page" aria-labelledby="update-article-title">

  @if(loading()) {

    <div class="loading-card" role="status">
      <span class="loader" aria-hidden="true"></span>
      <span>Loading article...</span>
    </div>

  } @else {

    <section class="editor-card">

      <header class="editor-header">
        <div>
          <span class="section-kicker"><i class="bi bi-pencil-square"></i> Writing workspace</span>
          <h1 id="update-article-title"><span>Edit</span> <strong>Article</strong></h1>
          <div class="title-line" aria-hidden="true"></div>
          <p>Refine your story and keep every detail moving forward.</p>
        </div>
        <div class="header-actions">
          <button class="back-btn" type="button" (click)="goBack()">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Back to article</span>
          </button>
          <div class="draft-badge"><i class="bi bi-pencil"></i> Editing draft</div>
        </div>
      </header>

      <div class="field title-field">

        <label for="article-title">Article title</label>

        <input
          id="article-title"
          type="text"
          [value]="title()"
          (input)="title.set($any($event.target).value)"
          placeholder="Give your article a memorable title..."
        />

      </div>

      <div class="field">

        <div class="label-row">
          <label for="article-content">Content</label>
          <span>{{ content().length }} characters</span>
        </div>

        <textarea
          id="article-content"
          [value]="content()"
          (input)="content.set($any($event.target).value)"
          placeholder="Edit your article here..."></textarea>

      </div>

      <footer class="editor-footer">
        <span class="writing-tip"><i class="bi bi-lightbulb"></i> Tip: keep your title focused and your opening clear.</span>
        <button
          class="submit-btn"
          type="button"
          [disabled]="saving()"
          (click)="update()">
          @if(!saving()) {
            <i class="bi bi-check2" aria-hidden="true"></i>
            <span>Save changes</span>
          } @else {
            <span class="button-loader" aria-hidden="true"></span>
            <span>Saving...</span>
          }
        </button>
      </footer>

    </section>

  }

</main>
