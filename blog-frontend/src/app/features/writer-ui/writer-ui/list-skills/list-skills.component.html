<main class="page" aria-labelledby="skills-library-title">

  <div class="header-card">
    <span class="section-kicker"><i class="bi bi-collection-fill"></i> Knowledge library</span>
    <h1 id="skills-library-title"><span>Skills</span> <strong>Library</strong></h1>
    <div class="title-line" aria-hidden="true"></div>
    <p>Browse all registered skills in the system.</p>
  </div>

  <section class="skills-container" aria-label="Registered skills">

    @for(skill of skills; track skill.id; let i = $index) {

      <article
        class="skill-card"
        [style.animation-delay.ms]="i * 120">

        <div class="emoji">
          {{ getFieldEmoji(skill.field) }}
        </div>

        <div class="content">
          <h3>{{ skill.name }}</h3>
          <span class="field">
            {{ skill.field }}
          </span>
        </div>

        <i class="bi bi-arrow-up-right card-arrow" aria-hidden="true"></i>
      </article>

    } @empty {
      <div class="empty-state">
        <i class="bi bi-inbox" aria-hidden="true"></i>
        <p>No skills have been registered yet.</p>
      </div>
    }

  </section>

</main>


<button
  class="back-button"
  type="button"
  (click)="goBack()">
  <i class="bi bi-arrow-left" aria-hidden="true"></i>
  <span>Back to Dashboard</span>
</button>
