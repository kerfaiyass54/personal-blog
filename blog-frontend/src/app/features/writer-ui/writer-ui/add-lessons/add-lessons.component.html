<main class="page" aria-labelledby="create-lesson-title">

  <section class="lesson-card">

    <div class="card-header">
      <div class="icon-container"><i class="bi bi-journal-plus"></i></div>
      <div>
        <span class="section-kicker">Learning workspace</span>
        <h1 id="create-lesson-title"><span>Create</span> <strong>Lesson</strong></h1>
        <div class="title-line" aria-hidden="true"></div>
        <p>Share knowledge with your readers.</p>
      </div>
    </div>

    <form
      class="lesson-form"
      (ngSubmit)="createLesson()">

      <div class="field">

        <label for="lesson-title">Lesson title</label>

        <input
          id="lesson-title"
          type="text"
          [(ngModel)]="lesson.title"
          name="title"
          placeholder="Enter lesson title..." />

      </div>

      <div class="field">

        <div class="label-row">
          <label for="lesson-content">Lesson content</label>
          <span>{{ lesson.content.length }} characters</span>
        </div>

        <textarea
          id="lesson-content"
          rows="8"
          [(ngModel)]="lesson.content"
          name="content"
          placeholder="Write your lesson content...">
        </textarea>

      </div>

      <button
        type="submit"
        [disabled]="loading">

        @if (!loading) {
          <i class="bi bi-send" aria-hidden="true"></i>
          <span>Publish lesson</span>
        }

        @if (loading) {
          <span class="loader" aria-hidden="true"></span>
          <span>Creating...</span>
        }

      </button>

    </form>

    @if (successMessage) {

      <div class="success-box" role="status">
        <i class="bi bi-check-circle" aria-hidden="true"></i>
        {{ successMessage }}
      </div>

    }

  </section>

</main>
